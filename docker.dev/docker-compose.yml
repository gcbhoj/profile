services:
  frontend:
    build:
      context: ..
      dockerfile: docker.dev/Dockerfile

    container_name: frontend

    ports:
      - "3000:3000"

    volumes:
      - ..:/app
      - frontend_node_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    restart: unless-stopped

    networks:
      - my-app

volumes:
  frontend_node_modules:

networks:
  my-app:
    driver: bridge
